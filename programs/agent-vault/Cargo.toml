[package]
name = "agent-vault"
version = "0.1.0"
description = "StakePilot Agent Vault - Autonomous staking vault controlled by AI agents"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.28.0", features = ["init-if-needed"] }

[dev-dependencies]
anchor-client = "0.28.0"
